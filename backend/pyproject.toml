[project]
name = "qq-official-bot-proxy-backend"
version = "0.1.0"
description = "QQ official bot proxy authorization backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2.8,<5.3",
    "djangorestframework>=3.16,<3.17",
    "cryptography>=46,<47",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
